<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JD Resume Changer Settings</title>
  <style>
    body{max-width:900px;margin:40px auto;padding:0 20px;font-family:Arial}
    textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
    textarea{height:520px;font-family:Consolas,monospace}
    button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#111827;color:#fff}
  </style>
</head>
<body>
  <h1>Settings</h1>
  <p>Paste your current master Overleaf LaTeX source. This is the source of truth Gemini must preserve.</p>
  <textarea id="masterTex" placeholder="Paste resume.tex here..."></textarea>

  <p>Local compiler URL</p>
  <input id="serverUrl" value="http://localhost:8000">

  <div style="display:flex;gap:10px;align-items:center;margin-top:12px;">
    <button id="save">Save</button>
    <button id="testConn" type="button" style="background:#4b5563">Test Server Connection</button>
    <button id="syncServerMaster" type="button" style="background:#2563eb">Load Master from Server (9 Projects)</button>
    <span id="msg"></span>
  </div>
  <div id="serverStatus" style="margin-top:10px;font-size:13px;color:#374151;"></div>
  <script src="options.js"></script>
</body>
</html>
