# Alembic Configuration
# Database URL is loaded from environment via app.config.get_settings()
# Set DATABASE_URL in .env or environment (e.g., postgresql+asyncpg://user:pass@host/db)
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is overridden in env.py from get_settings().database_url
# This placeholder is required by alembic but not used at runtime
sqlalchemy.url = sqlite+aiosqlite:///./placeholder.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
