version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jd-resume-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jd_resume_changer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jd-resume-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jd-resume-backend
    environment:
      # Required: Database & Redis
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/jd_resume_changer
      REDIS_URL: redis://redis:6379

      # Required: Security secrets (generate with: python -c "import secrets; print(secrets.token_urlsafe(32))")
      APP_SECRET: ${APP_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30

      # Optional: OAuth credentials (needed for social login)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      # Frontend URL for CORS
      FRONTEND_URL: http://localhost:3000

      # Server
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: production

      # LLM Provider API Keys (at least one required for resume generation)
      # Google Gemini: https://aistudio.google.com/apikey
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}

      # OpenAI: https://platform.openai.com/api-keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # Anthropic Claude: https://console.anthropic.com/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}

      # Grok (xAI): https://console.x.ai/
      GROK_API_KEY: ${GROK_API_KEY}
      GROK_MODEL: ${GROK_MODEL:-grok-beta}

      # OpenRouter (multi-provider gateway): https://openrouter.ai/keys
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}

      # NVIDIA NIM: https://build.nvidia.com/explore/discover
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}

      # Ollama (local) - no API key needed
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}

      # File upload & rate limiting
      MAX_UPLOAD_SIZE_MB: 10
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: >
      sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000'

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jd-resume-frontend
    environment:
      # Required: NextAuth (generate with: openssl rand -base64 32)
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # Optional: OAuth credentials
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      # Backend API
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  nginx:
    image: nginx:alpine
    container_name: jd-resume-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
